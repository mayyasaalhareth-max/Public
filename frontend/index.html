<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Task Management</title>
    <link rel="stylesheet" href="Css/bootstrap.css" />
    <link rel="stylesheet" href="Css/style.css" />
  </head>
  <body>
    <div class="container mt-4">
      <!-- أزرار الفلترة المربوطة بالجافاسكريبت -->
      <div class="btn-group mb-3" role="group" aria-label="Task Filters">
        <input
          type="radio"
          class="btn-check"
          name="btnradio"
          id="filterAll"
          value="الكل"
          autocomplete="off"
          checked
        />
        <label class="btn btn-outline-primary" for="filterAll">الكل</label>

        <input
          type="radio"
          class="btn-check"
          name="btnradio"
          id="filterNotStarted"
          value="لم يبدأ"
          autocomplete="off"
        />
        <label class="btn btn-outline-primary" for="filterNotStarted"
          >لم يبدأ</label
        >

        <input
          type="radio"
          class="btn-check"
          name="btnradio"
          id="filterInProgress"
          value="قيد التنفيذ"
          autocomplete="off"
        />
        <label class="btn btn-outline-primary" for="filterInProgress"
          >قيد التنفيذ</label
        >

        <input
          type="radio"
          class="btn-check"
          name="btnradio"
          id="filterCompleted"
          value="منفذة"
          autocomplete="off"
        />
        <label class="btn btn-outline-primary" for="filterCompleted"
          >منفذة</label
        >
      </div>

      <!-- الجدول (فارغ بانتظار الجافاسكريبت) -->
      <table class="table mt-3 align-middle text-center">
        <thead class="table-dark">
          <tr>
            <th scope="col">#</th>
            <th scope="col">Owner</th>
            <th scope="col">Task Name</th>
            <th scope="col">Description</th>
            <th scope="col">Status</th>
          </tr>
        </thead>
        <tbody class="table-group-divider" id="tableBody">
          <!-- سيتم رسم المهام هنا برمجياً -->
        </tbody>
      </table>

      <!-- أزرار النوافذ -->
      <button
        type="button"
        class="btn btn-primary"
        data-bs-toggle="modal"
        data-bs-target="#userModal"
      >
        Create User
      </button>
      <button
        type="button"
        class="btn btn-success"
        data-bs-toggle="modal"
        data-bs-target="#taskModal"
      >
        Create Task
      </button>
    </div>

    <!-- بقية النوافذ (Modals) كما هي في كودك تماماً -->

    <!-- 1. نافذة إضافة مستخدم (User Modal) -->
    <div class="modal fade" id="userModal" tabindex="-1" aria-hidden="true">
      <div class="modal-dialog">
        <div class="modal-content">
          <div class="modal-header">
            <h1 class="modal-title fs-5">Create User</h1>
            <button
              type="button"
              class="btn-close"
              data-bs-dismiss="modal"
              aria-label="Close"
            ></button>
          </div>
          <form id="createUserForm">
            <div class="modal-body">
              <div class="mb-3">
                <label class="form-label">Full Name</label>
                <!-- تم إضافة id="userNameInput" هنا لنتمكن من قراءته -->
                <input
                  type="text"
                  class="form-control"
                  id="userNameInput"
                  placeholder="Enter full name"
                  required
                />
              </div>
              <div class="mb-3">
                <label class="form-label">Gender</label>
                <select class="form-select" id="userGenderInput" required>
                  <option value="" selected disabled>Select Gender</option>
                  <option value="Male">Male</option>
                  <option value="Female">Female</option>
                </select>
              </div>
            </div>
            <div class="modal-footer">
              <button
                type="button"
                class="btn btn-secondary"
                data-bs-dismiss="modal"
              >
                Close
              </button>
              <!-- تم تحويل نوع الزر إلى submit -->
              <button type="submit" class="btn btn-primary">Save User</button>
            </div>
          </form>
        </div>
      </div>
    </div>

    <!-- 2. نافذة إضافة مهمة (Task Modal) -->
    <div class="modal fade" id="taskModal" tabindex="-1" aria-hidden="true">
      <div class="modal-dialog">
        <div class="modal-content">
          <div class="modal-header">
            <h1 class="modal-title fs-5">Create Task</h1>
            <button
              type="button"
              class="btn-close"
              data-bs-dismiss="modal"
              aria-label="Close"
            ></button>
          </div>
          <form id="createTaskForm">
            <div class="modal-body">
              <div class="mb-3">
                <label class="form-label">Task Name</label>
                <input
                  type="text"
                  class="form-control"
                  id="taskNameInput"
                  required
                />
              </div>
              <div class="mb-3">
                <!-- تم تحويل هذا الحقل إلى Select بدلاً من datalist لمنع الكتابة الحرة -->
                <label class="form-label">Owner Name</label>
                <select class="form-select" id="taskOwnerInput" required>
                  <option value="" selected disabled>Select an owner...</option>
                  <!-- سيتم إضافة أسماء المستخدمين هنا برمجياً -->
                </select>
              </div>
              <div class="mb-3">
                <label class="form-label">Description</label>
                <textarea
                  class="form-control"
                  id="taskDescInput"
                  rows="2"
                  required
                ></textarea>
              </div>
            </div>
            <div class="modal-footer">
              <button
                type="button"
                class="btn btn-secondary"
                data-bs-dismiss="modal"
              >
                Close
              </button>
              <button type="submit" class="btn btn-success">Save Task</button>
            </div>
          </form>
        </div>
      </div>
    </div>

    <script src="Js/bootstrap.bundle.js"></script>
    <script src="Js/main.js"></script>
  </body>
</html>
